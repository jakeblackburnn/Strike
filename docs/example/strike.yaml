# Project config for the example tour. This folder is one project of the site
# rooted one level up, so only project-scope keys belong here — the theme,
# default width, and serve defaults are site-wide and live in ../strike.yaml.
#
# Every key here is optional — delete the file and the project still works.

title: strikedown by example
description: Every language feature, in a document you can read and then open in your editor.

order:                  # nav order; unlisted entries follow alphabetically
  - markdown.md
  - syntax.sx
  - layout.md
  - citations.md
  - degradation.md
  - guide

labels:                 # nav labels; otherwise the first heading, then the filename
  markdown.md: The markdown subset
  syntax.sx: One flavor (.sx)
  layout.md: Layout & commands
  citations.md: Citations
  degradation.md: Degradation
  guide: Guide           # folders take labels too

hidden:                 # dropped from the nav AND from the routes (404)
  - guide/scratch.md
